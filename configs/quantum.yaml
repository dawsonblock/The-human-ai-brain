# Quantum Workspace Configuration
dimension: 7
dt: 0.001
entropy_cap: logN  # Will be computed as log(dimension)
decoherence_rate: 1.0e-8
trace_tolerance: 1.0e-10
eigenvalue_floor: 1.0e-12
max_dwell_ms: 120
rng_seed: 42

# Lindblad operators configuration
lindblad:
  num_operators: 3
  coupling_strength: 0.01

# Collapse configuration
collapse:
  method: "projective"  # projective, soft, gumbel
  temperature: 0.1      # for soft collapse
