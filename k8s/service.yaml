apiVersion: v1
kind: Service
metadata:
  name: brain-system-grpc
  namespace: brain-prod
  labels:
    app: brain-system
    component: core
spec:
  type: ClusterIP
  selector:
    app: brain-system
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: brain-system-metrics
  namespace: brain-prod
  labels:
    app: brain-system
    component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: brain-system
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
