apiVersion: v1
kind: Service
metadata:
  name: brain-server
  labels:
    app: brain-fdqc
    component: server
spec:
  type: LoadBalancer
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: brain-fdqc
    component: server
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: brain-server-headless
  labels:
    app: brain-fdqc
    component: server
spec:
  clusterIP: None
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  selector:
    app: brain-fdqc
    component: server
