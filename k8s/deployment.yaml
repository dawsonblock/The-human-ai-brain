apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-system
  namespace: brain-prod
  labels:
    app: brain-system
    version: v3.4.0
    component: core
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: brain-system
  template:
    metadata:
      labels:
        app: brain-system
        version: v3.4.0
        component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: Localhost
          localhostProfile: brain-seccomp.json
      
      containers:
      - name: brain-server
        image: ghcr.io/dawsonblock/the-human-ai-brain/brain:v3.4.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: BRAIN_CONFIG
          value: /app/config/quantum.yaml
        - name: BRAIN_LOG_LEVEL
          value: info
        - name: BRAIN_METRICS_PORT
          value: "9090"
        - name: BRAIN_GRPC_PORT
          value: "50051"
        - name: CONFIG_SIGNATURE_REQUIRED
          valueFrom:
            configMapKeyRef:
              name: brain-config
              key: signature_required
              optional: true
        - name: SECCOMP_ENABLED
          value: "1"
        - name: KILL
          valueFrom:
            configMapKeyRef:
              name: brain-config
              key: kill_switch
              optional: true
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
              - ALL
        
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      
      volumes:
      - name: config
        configMap:
          name: brain-config
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - brain-system
              topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 30
