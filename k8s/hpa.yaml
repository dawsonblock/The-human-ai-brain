apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brain-system-hpa
  namespace: brain-prod
  labels:
    app: brain-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brain-system
  minReplicas: 3
  maxReplicas: 10
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metrics from Prometheus (example)
  # Requires Prometheus Adapter to be installed
  - type: Pods
    pods:
      metric:
        name: brain_step_latency_ms_avg
      target:
        type: AverageValue
        averageValue: "5"  # Scale up if avg latency > 5ms
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
