apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brain-server-hpa
  labels:
    app: brain-fdqc
  annotations:
    # Ensure Deployment sets CPU/memory requests; HPA Utilization is relative to requests.
    # If requests are absent, consider switching to AverageValue targets.
    autoscaling.alpha.kubernetes.io/conditions: ""
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brain-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
            periodSeconds: 60
          selectPolicy: Min
        scaleUp:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
