apiVersion: v1
kind: ConfigMap
metadata:
  name: brain-config
  namespace: brain-prod
  labels:
    app: brain-system
data:
  quantum.yaml: |
    quantum_workspace:
      dimension: 7
      dt: 0.01
      entropy_threshold: 1.9459
      decoherence_rate: 0.05
      trace_tolerance: 1e-10
      eigenvalue_floor: 1e-12
      max_dwell_ms: 120.0
      collapse_rate_target_hz: 8.2
      rng_seed: 42
    
    tiered_memory:
      hot:
        capacity: 50000
        consolidation_threshold: 0.7
      warm:
        capacity: 300000
        consolidation_threshold: 0.5
      cold:
        capacity: 2000000
        consolidation_threshold: 0.3
      deduplication:
        enabled: true
        num_hashes: 128
      temporal_decay:
        half_life_days: 30.0
        floor: 0.01
    
    grpc:
      port: 50051
      max_workers: 10
    
    metrics:
      enabled: true
      port: 9090
  
  signature_required: "0"
  kill_switch: "0"
